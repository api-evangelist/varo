        url: https://www.openbankingtracker.com/provider/varomoney
      - type: PlaidIntegration
        url: https://plaid.com/customer-stories/varo/
      - url: graphql/varo-graphql.md
        type: GraphQL
    contact:
      - FN: Varo Bank Support
        url: https://support.varomoney.com/hc/en-us
  - aid: varo:varo-aggregator-access
    name: Varo Aggregator Data Access (Plaid)
    description: The real, documented seam through which third-party applications reach Varo Bank account data. Varo runs a native Plaid integration that lets customers link their Varo accounts to external financial apps and permission the sharing of balances, transactions, identity, and account/routing details. In the broader US open-finance ecosystem Varo data is also reachable through other aggregators (MX, Finicity, Akoya, Yodlee). This is aggregator-mediated access under the customer's consent — not a Varo-published first-party API — and carries Plaid's authentication (OAuth-style permissioned linking), not any Varo-issued API credentials.
    humanURL: https://plaid.com/customer-stories/varo/
    baseURL: https://production.plaid.com
    tags:
      - Open Banking
      - Aggregator
      - Plaid
      - Data Access
      - Account Aggregation
      - United States
