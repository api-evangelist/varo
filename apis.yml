- aid: varo:varo-advance
  name: Varo Advance (Cash Advance) API
  description: Short-term cash advance capability enabling eligible Varo customers to
    access $20–$500 with a flat fee and no interest, repaid automatically on the next
    qualifying direct deposit, providing overdraft protection and instant liquidity
    for consumer financial services. Varo exposes no public API for this feature; it
    is delivered exclusively inside the Varo mobile app, and any external visibility
    into related account activity is via customer-permissioned open-finance aggregators.
  humanURL: https://www.varomoney.com/cash-advance/
