apis:
  - aid: varo:varo-bank-account
    name: Varo Bank Account API
    description: Consumer-facing checking-account capability of Varo Bank, N.A., covering fee-free checking, early direct deposit (up to two days early), debit card management, access to 55,000+ Allpoint ATMs, cash deposits at retail locations, and cashback rewards. Varo publishes no first-party API documentation for this product; account balance and transaction data are reachable by third-party applications only via US open-finance aggregators such as Plaid, MX, Finicity, or Akoya under customer-permissioned data access.
    humanURL: https://www.varomoney.com/bank-account/
    baseURL: https://api.varomoney.com
    tags:
