- aid: varo:varo-line-of-credit
  name: Varo Personal Line of Credit API
  description: Personal-credit capability offering up to $2,000 with a single flat fee,
    no interest, no late fees or prepayment penalties, and repayment terms up to 12
    months, designed to provide flexible, consumer-friendly credit access. This product
    has no public developer API or documented spec; it operates entirely within the
    Varo mobile app, and no first-party programmatic interface is published for external
    integration.
  humanURL: https://www.varomoney.com/line-of-credit/
