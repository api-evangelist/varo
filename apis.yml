name: Varo Bank
kind: company
description: Varo Bank is a mobile-first, FDIC-chartered digital bank offering fee-free
  checking and high-yield savings accounts, early direct deposit, instant cash advances,
  a credit-builder card, and a personal line of credit. Varo does not operate a public,
  first-party developer API or developer portal; its consumer banking data is reachable
  by third-party applications only through US open-finance aggregators such as Plaid
  (a documented, native integration), and potentially MX, Finicity, or Akoya. The
  surface catalogued here maps Varo's real consumer product family and the aggregator
  seam through which that data is accessed.
