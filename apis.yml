- aid: varo:varo-savings-account
  name: Varo Savings Account API
  description: High-yield savings capability delivering up to 5.00% APY on balances
    up to $5,000 (2.50% APY above that threshold), with automated savings tools, round-ups,
    named savings goals, and no monthly fees. As with all Varo products, no public
    developer API or spec is published; balance and transaction data are accessed by
    third-party financial apps only through customer-permissioned open-finance aggregators
    such as Plaid, MX, Finicity, or Akoya.
